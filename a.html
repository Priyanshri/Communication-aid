<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Aid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation; /* Prevents double-tap zoom on mobile */
        }
        #transcriptContainer {
            min-height: 150px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            background-color: #9CA3AF; /* gray-400 */
            transition: background-color 0.3s ease;
        }
        .status-indicator.listening {
            background-color: #EF4444; /* red-500 */
            animation: pulse 1.5s infinite;
        }
        .status-indicator.speaking {
            background-color: #3B82F6; /* blue-500 */
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex items-center justify-center min-h-screen">

    <div class="w-full max-w-2xl mx-auto p-4 md:p-6 bg-white dark:bg-gray-800 rounded-2xl shadow-2xl space-y-6">
        
        <header class="text-center">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Communication Aid</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">Speak, and I'll write. Type, and I'll speak.</p>
        </header>

        <!-- Speech-to-Text Section -->
        <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg shadow-inner">
            <div class="flex items-center mb-3">
                <span id="sttStatus" class="status-indicator"></span>
                <h2 class="text-lg font-semibold">Live Transcription</h2>
            </div>
            <div id="transcriptContainer" class="w-full p-3 bg-white dark:bg-gray-800 rounded-md text-lg leading-relaxed overflow-y-auto">
                <p id="transcript" class="text-gray-500 dark:text-gray-400">Press "Start Listening" and begin speaking...</p>
            </div>
            <div class="mt-4 flex flex-col sm:flex-row gap-3">
                <button id="startButton" class="w-full flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800">
                    Start Listening
                </button>
                <button id="stopButton" class="w-full flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-300 dark:focus:ring-red-800" disabled>
                    Stop Listening
                </button>
            </div>
        </div>

        <!-- Text-to-Speech Section -->
        <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg shadow-inner">
            <div class="flex items-center mb-3">
                <span id="ttsStatus" class="status-indicator"></span>
                <h2 class="text-lg font-semibold">Type to Speak</h2>
            </div>
            <textarea id="textToSpeak" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Type your message here..."></textarea>
            <button id="speakButton" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-green-300 dark:focus:ring-green-800">
                Speak Text
            </button>
        </div>

        <!-- Quick Phrases Section -->
        <div class="p-4">
            <h2 class="text-lg font-semibold text-center mb-3">Quick Phrases</h2>
            <div id="quickPhrases" class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-sm">
                <!-- Phrases will be injected here by JS -->
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check for browser support for Web Speech API
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const SpeechSynthesis = window.speechSynthesis;

            if (!SpeechRecognition || !SpeechSynthesis) {
                alert("Sorry, your browser does not support the Web Speech API. Please try Chrome or Firefox.");
                return;
            }

            // DOM Elements
            const startButton = document.getElementById('startButton');
            const stopButton = document.getElementById('stopButton');
            const transcriptEl = document.getElementById('transcript');
            const textToSpeakEl = document.getElementById('textToSpeak');
            const speakButton = document.getElementById('speakButton');
            const sttStatus = document.getElementById('sttStatus');
            const ttsStatus = document.getElementById('ttsStatus');
            const quickPhrasesContainer = document.getElementById('quickPhrases');

            let recognition = new SpeechRecognition();
            recognition.continuous = true; // Keep listening even after a pause
            recognition.interimResults = true; // Show results as they are recognized
            recognition.lang = 'en-US';

            let finalTranscript = '';
            let isListening = false;

            // --- Speech-to-Text Logic ---

            recognition.onstart = () => {
                isListening = true;
                sttStatus.classList.add('listening');
                startButton.disabled = true;
                stopButton.disabled = false;
                transcriptEl.textContent = 'Listening...';
                transcriptEl.classList.remove('text-gray-500', 'dark:text-gray-400');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + '. ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                transcriptEl.textContent = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                sttStatus.classList.remove('listening');
            };

            recognition.onend = () => {
                isListening = false;
                sttStatus.classList.remove('listening');
                startButton.disabled = false;
                stopButton.disabled = true;
                if (finalTranscript === '') {
                    transcriptEl.textContent = 'Press "Start Listening" and begin speaking...';
                    transcriptEl.classList.add('text-gray-500', 'dark:text-gray-400');
                }
            };

            startButton.addEventListener('click', () => {
                if (!isListening) {
                    finalTranscript = ''; // Clear previous transcript
                    transcriptEl.textContent = '';
                    recognition.start();
                }
            });

            stopButton.addEventListener('click', () => {
                if (isListening) {
                    recognition.stop();
                }
            });

            // --- Text-to-Speech Logic ---

            speakButton.addEventListener('click', () => {
                const text = textToSpeakEl.value;
                if (text.trim() !== '' && !SpeechSynthesis.speaking) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    
                    utterance.onstart = () => {
                        ttsStatus.classList.add('speaking');
                        speakButton.disabled = true;
                    };

                    utterance.onend = () => {
                        ttsStatus.classList.remove('speaking');
                        speakButton.disabled = false;
                    };
                    
                    utterance.onerror = (event) => {
                        console.error('Speech synthesis error:', event.error);
                        ttsStatus.classList.remove('speaking');
                        speakButton.disabled = false;
                    };
                    
                    SpeechSynthesis.speak(utterance);
                }
            });

            // --- Quick Phrases Logic ---
            const phrases = [
                "Hello!",
                "How are you?",
                "Thank you.",
                "I need help.",
                "What is your name?",
                "Can you repeat that?",
                "Yes",
                "No",
                "Goodbye!"
            ];

            phrases.forEach(phrase => {
                const button = document.createElement('button');
                button.textContent = phrase;
                button.className = "p-2 bg-gray-200 dark:bg-gray-600 rounded-md hover:bg-blue-200 dark:hover:bg-blue-500 transition-colors";
                button.onclick = () => {
                    textToSpeakEl.value = phrase;
                    speakButton.click();
                };
                quickPhrasesContainer.appendChild(button);
            });

        });
    </script>
</body>
</html>
