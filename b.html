<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Communication Aid</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            touch-action: manipulation; /* Prevents double-tap zoom on mobile */
        }
        #transcriptContainer {
            min-height: 150px;
        }
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
            background-color: #9CA3AF; /* gray-400 */
            transition: background-color 0.3s ease;
        }
        .status-indicator.listening {
            background-color: #EF4444; /* red-500 */
            animation: pulse 1.5s infinite;
        }
        .status-indicator.speaking {
            background-color: #3B82F6; /* blue-500 */
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0% { transform: scale(0.9); opacity: 0.7; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.9); opacity: 0.7; }
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-900 dark:text-gray-100 flex items-center justify-center min-h-screen p-4">

    <div class="w-full max-w-2xl mx-auto bg-white dark:bg-gray-800 rounded-2xl shadow-2xl space-y-6">
        
        <header class="text-center p-4 md:p-6">
            <h1 class="text-2xl md:text-3xl font-bold text-gray-800 dark:text-white">Communication Aid</h1>
            <p class="text-gray-500 dark:text-gray-400 mt-1">Speak, and I'll write. Type, and I'll speak.</p>
        </header>

        <!-- Speech-to-Text Section -->
        <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg shadow-inner mx-4">
            <div class="flex items-center justify-between mb-3">
                <div class="flex items-center">
                    <span id="sttStatus" class="status-indicator"></span>
                    <h2 class="text-lg font-semibold">Live Transcription</h2>
                </div>
            </div>
             <!-- Language Selection Dropdown -->
            <div class="mb-3">
                <label for="languageSelect" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-1">Language:</label>
                <select id="languageSelect" class="w-full p-2 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500">
                    <!-- Languages will be populated by JavaScript -->
                </select>
            </div>
            <div id="transcriptContainer" class="w-full p-3 bg-white dark:bg-gray-800 rounded-md text-lg leading-relaxed overflow-y-auto">
                <p id="transcript" class="text-gray-500 dark:text-gray-400">Select a language, press "Start Listening", and begin speaking...</p>
            </div>
            <div class="mt-4 flex flex-col sm:flex-row gap-3">
                <button id="startButton" class="w-full flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-blue-300 dark:focus:ring-blue-800">
                    Start Listening
                </button>
                <button id="stopButton" class="w-full flex-1 bg-red-600 hover:bg-red-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-red-300 dark:focus:ring-red-800" disabled>
                    Stop Listening
                </button>
            </div>
        </div>

        <!-- Text-to-Speech Section -->
        <div class="bg-gray-50 dark:bg-gray-700 p-4 rounded-lg shadow-inner mx-4">
            <div class="flex items-center mb-3">
                <span id="ttsStatus" class="status-indicator"></span>
                <h2 class="text-lg font-semibold">Type to Speak</h2>
            </div>
            <textarea id="textToSpeak" class="w-full p-3 border border-gray-300 dark:border-gray-600 rounded-md bg-white dark:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-blue-500" rows="4" placeholder="Type your message here..."></textarea>
            <button id="speakButton" class="mt-4 w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-lg transition-transform transform hover:scale-105 focus:outline-none focus:ring-4 focus:ring-green-300 dark:focus:ring-green-800">
                Speak Text
            </button>
        </div>

        <!-- Quick Phrases Section -->
        <div class="p-4 mx-4">
            <h2 class="text-lg font-semibold text-center mb-3">Quick Phrases</h2>
            <div id="quickPhrases" class="grid grid-cols-2 sm:grid-cols-3 gap-2 text-sm">
                <!-- Phrases will be injected here by JS -->
            </div>
        </div>

    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Check for browser support for Web Speech API
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const SpeechSynthesis = window.speechSynthesis;

            if (!SpeechRecognition || !SpeechSynthesis) {
                // Using a custom modal instead of alert
                const modal = document.createElement('div');
                modal.style.position = 'fixed';
                modal.style.left = '0';
                modal.style.top = '0';
                modal.style.width = '100%';
                modal.style.height = '100%';
                modal.style.backgroundColor = 'rgba(0,0,0,0.5)';
                modal.style.display = 'flex';
                modal.style.justifyContent = 'center';
                modal.style.alignItems = 'center';
                modal.innerHTML = `<div style="background: white; color: black; padding: 20px; border-radius: 8px;">Sorry, your browser does not support the Web Speech API. Please try Chrome or Firefox.</div>`;
                document.body.appendChild(modal);
                return;
            }

            // --- Language Data ---
            const languages = [
                { name: 'English (US)', code: 'en-US' },
                // Indian Languages
                { name: 'Hindi (India)', code: 'hi-IN' },
                { name: 'Bengali (India)', code: 'bn-IN' },
                { name: 'Gujarati (India)', code: 'gu-IN' },
                { name: 'Kannada (India)', code: 'kn-IN' },
                { name: 'Malayalam (India)', code: 'ml-IN' },
                { name: 'Marathi (India)', code: 'mr-IN' },
                { name: 'Odia (India)', code: 'or-IN' },
                { name: 'Punjabi (India)', code: 'pa-IN' },
                { name: 'Tamil (India)', code: 'ta-IN' },
                { name: 'Telugu (India)', code: 'te-IN' },
                { name: 'Urdu (India)', code: 'ur-IN' },
                // World Languages
                { name: 'Arabic (Egypt)', code: 'ar-EG' },
                { name: 'Chinese (Mandarin, Simplified)', code: 'zh-CN' },
                { name: 'Dutch (Netherlands)', code: 'nl-NL' },
                { name: 'French (France)', code: 'fr-FR' },
                { name: 'German (Germany)', code: 'de-DE' },
                { name: 'Indonesian (Indonesia)', code: 'id-ID' },
                { name: 'Italian (Italy)', code: 'it-IT' },
                { name: 'Japanese (Japan)', code: 'ja-JP' },
                { name: 'Korean (South Korea)', code: 'ko-KR' },
                { name: 'Portuguese (Brazil)', code: 'pt-BR' },
                { name: 'Russian (Russia)', code: 'ru-RU' },
                { name: 'Spanish (Spain)', code: 'es-ES' },
                { name: 'Turkish (Turkey)', code: 'tr-TR' },
                { name: 'Vietnamese (Vietnam)', code: 'vi-VN' },
            ];

            // DOM Elements
            const startButton = document.getElementById('startButton');
            const stopButton = document.getElementById('stopButton');
            const transcriptEl = document.getElementById('transcript');
            const textToSpeakEl = document.getElementById('textToSpeak');
            const speakButton = document.getElementById('speakButton');
            const sttStatus = document.getElementById('sttStatus');
            const ttsStatus = document.getElementById('ttsStatus');
            const quickPhrasesContainer = document.getElementById('quickPhrases');
            const languageSelect = document.getElementById('languageSelect');

            // --- Language Selection Logic ---
            languages.forEach(lang => {
                const option = document.createElement('option');
                option.value = lang.code;
                option.textContent = lang.name;
                languageSelect.appendChild(option);
            });
            
            let recognition = new SpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = languageSelect.value; // Set initial language

            let finalTranscript = '';
            let isListening = false;
            let shouldRestartRecognition = false; // Flag to handle restart on language change

            languageSelect.addEventListener('change', () => {
                recognition.lang = languageSelect.value;
                if (isListening) {
                    shouldRestartRecognition = true;
                    recognition.stop();
                }
            });

            // --- Speech-to-Text Logic ---
            recognition.onstart = () => {
                isListening = true;
                sttStatus.classList.add('listening');
                startButton.disabled = true;
                stopButton.disabled = false;
                transcriptEl.textContent = 'Listening...';
                transcriptEl.classList.remove('text-gray-500', 'dark:text-gray-400');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript + '. ';
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                transcriptEl.textContent = finalTranscript + interimTranscript;
            };

            recognition.onerror = (event) => {
                console.error('Speech recognition error:', event.error);
                sttStatus.classList.remove('listening');
            };

            recognition.onend = () => {
                isListening = false;
                sttStatus.classList.remove('listening');
                startButton.disabled = false;
                stopButton.disabled = true;
                
                if (shouldRestartRecognition) {
                    shouldRestartRecognition = false;
                    recognition.start();
                } else if (finalTranscript === '') {
                    transcriptEl.textContent = 'Press "Start Listening" and begin speaking...';
                    transcriptEl.classList.add('text-gray-500', 'dark:text-gray-400');
                }
            };

            startButton.addEventListener('click', () => {
                if (!isListening) {
                    finalTranscript = ''; // Clear previous transcript
                    transcriptEl.textContent = '';
                    recognition.start();
                }
            });

            stopButton.addEventListener('click', () => {
                shouldRestartRecognition = false; // User manually stopped it
                if (isListening) {
                    recognition.stop();
                }
            });

            // --- Text-to-Speech Logic ---
            speakButton.addEventListener('click', () => {
                const text = textToSpeakEl.value;
                if (text.trim() !== '' && !SpeechSynthesis.speaking) {
                    const utterance = new SpeechSynthesisUtterance(text);
                    utterance.lang = languageSelect.value; // Use selected language for speech
                    
                    utterance.onstart = () => {
                        ttsStatus.classList.add('speaking');
                        speakButton.disabled = true;
                    };

                    utterance.onend = () => {
                        ttsStatus.classList.remove('speaking');
                        speakButton.disabled = false;
                    };
                    
                    utterance.onerror = (event) => {
                        console.error('Speech synthesis error:', event.error);
                        ttsStatus.classList.remove('speaking');
                        speakButton.disabled = false;
                    };
                    
                    SpeechSynthesis.speak(utterance);
                }
            });

            // --- Quick Phrases Logic (English default) ---
            const phrases = [
                "Hello!", "How are you?", "Thank you.", "I need help.",
                "What is your name?", "Can you repeat that?", "Yes", "No", "Goodbye!"
            ];

            phrases.forEach(phrase => {
                const button = document.createElement('button');
                button.textContent = phrase;
                button.className = "p-2 bg-gray-200 dark:bg-gray-600 rounded-md hover:bg-blue-200 dark:hover:bg-blue-500 transition-colors";
                button.onclick = () => {
                    textToSpeakEl.value = phrase;
                    speakButton.click();
                };
                quickPhrasesContainer.appendChild(button);
            });

        });
    </script>
</body>
</html>
