<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech-to-Text Application</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        /* Use the Inter font family */
        body {
            font-family: 'Inter', sans-serif;
        }

        /* Custom animation for the listening status */
        .listening-pulse {
            box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
            animation: pulse-red 1.5s infinite;
        }

        @keyframes pulse-red {
            0% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0.7);
            }
            70% {
                box-shadow: 0 0 0 12px rgba(220, 38, 38, 0);
            }
            100% {
                box-shadow: 0 0 0 0 rgba(220, 38, 38, 0);
            }
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-200 flex flex-col items-center justify-center min-h-screen p-4 sm:p-6">

    <div class="w-full max-w-3xl">

        <header class="text-center mb-8">
            <h1 class="text-4xl font-bold text-slate-900 dark:text-white">
                VoiceNote 🎤
            </h1>
            <p class="text-slate-500 dark:text-slate-400 mt-2">Your modern speech-to-text companion. Just click the mic and start talking.</p>
        </header>

        <div class="bg-white dark:bg-slate-800/50 backdrop-blur-sm border border-slate-200 dark:border-slate-700 rounded-2xl shadow-lg w-full">
            
            <div class="flex flex-wrap items-center justify-between p-4 border-b border-slate-200 dark:border-slate-700 gap-4">
                
                <div class="flex items-center space-x-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-slate-400" viewBox="0 0 20 20" fill="currentColor">
                        <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM4.332 8.027a6.012 6.012 0 011.912-2.706C6.512 5.73 6.512 5.27 6.234 5.033L5.033 3.832a.75.75 0 00-1.06 1.06l.25.25a6.012 6.012 0 01-1.885 3.592.75.75 0 001.06 1.061l.25-.25zM12.967 5.033a.75.75 0 00-1.06-1.06l-.25.25a6.012 6.012 0 011.885 3.592.75.75 0 001.06-1.061l-.25-.25a6.012 6.012 0 01-1.912-2.706z" clip-rule="evenodd" />
                    </svg>
                    <select id="languageSelect" class="bg-transparent text-sm font-medium focus:ring-0 border-0 p-0 text-slate-600 dark:text-slate-300">
                        </select>
                </div>

                <div class="flex items-center space-x-1">
                    <span class="text-sm font-medium text-slate-500 mr-2">Font:</span>
                    <button id="decreaseFontBtn" title="Decrease font size" class="w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 rounded-full font-bold text-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">-</button>
                    <button id="increaseFontBtn" title="Increase font size" class="w-8 h-8 flex items-center justify-center bg-slate-100 dark:bg-slate-700 rounded-full font-bold text-lg hover:bg-slate-200 dark:hover:bg-slate-600 transition-colors">+</button>
                </div>
            </div>

            <div id="transcriptEl" class="w-full min-h-[250px] p-6 text-base text-slate-500 dark:text-slate-400 whitespace-pre-wrap transition-all duration-300" style="font-size: 16px;">
                Press the microphone button to start transcribing...
            </div>

            <div class="flex items-center justify-between p-4 border-t border-slate-200 dark:border-slate-700">
                <div class="flex items-center">
                    <div id="sttStatus" class="w-3 h-3 rounded-full bg-slate-400 transition-all duration-300"></div>
                    <span id="statusText" class="ml-2.5 text-sm font-semibold text-slate-500 dark:text-slate-400">Idle</span>
                </div>

                <div class="flex space-x-3">
                    <button id="startButton" class="group w-14 h-14 flex items-center justify-center bg-sky-500 text-white font-semibold rounded-full shadow-lg hover:bg-sky-600 focus:outline-none focus:ring-2 focus:ring-sky-400 focus:ring-opacity-75 transition-all disabled:opacity-50 disabled:cursor-not-allowed">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z" />
                        </svg>
                    </button>
                    <button id="stopButton" class="group w-14 h-14 flex items-center justify-center bg-red-500 text-white font-semibold rounded-full shadow-lg hover:bg-red-600 focus:outline-none focus:ring-2 focus:ring-red-400 focus:ring-opacity-75 transition-all disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" viewBox="0 0 20 20" fill="currentColor">
                           <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clip-rule="evenodd" />
                        </svg>
                    </button>
                </div>
            </div>

        </div>

        <div class="mt-10">
            <h3 class="text-lg font-semibold text-center text-slate-600 dark:text-slate-300 mb-4">How It Works</h3>
            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 text-center">
                <div class="bg-white/60 dark:bg-slate-800/50 p-4 rounded-lg">
                    <span class="text-2xl">🌐</span>
                    <p class="mt-1 text-sm font-medium">1. Select Language</p>
                </div>
                <div class="bg-white/60 dark:bg-slate-800/50 p-4 rounded-lg">
                    <span class="text-2xl">🎙️</span>
                    <p class="mt-1 text-sm font-medium">2. Press the Mic Button</p>
                </div>
                <div class="bg-white/60 dark:bg-slate-800/50 p-4 rounded-lg">
                    <span class="text-2xl">🗣️</span>
                    <p class="mt-1 text-sm font-medium">3. Start Speaking</p>
                </div>
                <div class="bg-white/60 dark:bg-slate-800/50 p-4 rounded-lg">
                    <span class="text-2xl">⏹️</span>
                    <p class="mt-1 text-sm font-medium">4. Press Stop to Finish</p>
                </div>
            </div>
        </div>

    </div>

    <script>
        // --- Setup and Initialization ---
        
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if (!SpeechRecognition) {
            alert("Sorry, your browser does not support the Web Speech API. Try Chrome or Edge.");
        }
        
        const recognition = new SpeechRecognition();
        
        // Get DOM elements
        const startButton = document.getElementById('startButton');
        const stopButton = document.getElementById('stopButton');
        const sttStatus = document.getElementById('sttStatus');
        const statusText = document.getElementById('statusText');
        const transcriptEl = document.getElementById('transcriptEl');
        const languageSelect = document.getElementById('languageSelect');
        const increaseFontBtn = document.getElementById('increaseFontBtn');
        const decreaseFontBtn = document.getElementById('decreaseFontBtn');

        const languages = [
            { name: 'English (US)', code: 'en-US' },
            // Indian Languages
            { name: 'Hindi (India)', code: 'hi-IN' },
            { name: 'Bengali (India)', code: 'bn-IN' },
            { name: 'Gujarati (India)', code: 'gu-IN' },
            { name: 'Kannada (India)', code: 'kn-IN' },
            { name: 'Malayalam (India)', code: 'ml-IN' },
            { name: 'Marathi (India)', code: 'mr-IN' },
            { name: 'Odia (India)', code: 'or-IN' },
            { name: 'Punjabi (India)', code: 'pa-IN' },
            { name: 'Tamil (India)', code: 'ta-IN' },
            { name: 'Telugu (India)', code: 'te-IN' },
            { name: 'Urdu (India)', code: 'ur-IN' },
            // World Languages
            { name: 'Arabic (Egypt)', code: 'ar-EG' },
            { name: 'Chinese (Mandarin, Simplified)', code: 'zh-CN' },
            { name: 'Dutch (Netherlands)', code: 'nl-NL' },
            { name: 'French (France)', code: 'fr-FR' },
            { name: 'German (Germany)', code: 'de-DE' },
            { name: 'Indonesian (Indonesia)', code: 'id-ID' },
            { name: 'Italian (Italy)', code: 'it-IT' },
            { name: 'Japanese (Japan)', code: 'ja-JP' },
            { name: 'Korean (South Korea)', code: 'ko-KR' },
            { name: 'Portuguese (Brazil)', code: 'pt-BR' },
            { name: 'Russian (Russia)', code: 'ru-RU' },
            { name: 'Spanish (Spain)', code: 'es-ES' },
            { name: 'Turkish (Turkey)', code: 'tr-TR' },
            { name: 'Vietnamese (Vietnam)', code: 'vi-VN' },
        ];

        // Populate the dropdown with language options
        languages.forEach(language => {
            const option = document.createElement('option');
            option.value = language.code;
            option.textContent = language.name;
            if (language.code === 'en-US') { // Default to English
                option.selected = true;
            }
            languageSelect.appendChild(option);
        });

        // State variables
        let isListening = false;
        let finalTranscript = '';

        // Configure recognition settings
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = languageSelect.value;

        // --- Speech-to-Text Logic ---

        recognition.onstart = () => {
            isListening = true;
            sttStatus.classList.remove('bg-slate-400');
            sttStatus.classList.add('bg-red-500', 'listening-pulse'); // New listening style
            statusText.textContent = 'Listening...';
            startButton.disabled = true;
            stopButton.disabled = false;
            languageSelect.disabled = true;
            transcriptEl.textContent = ''; // Clear text on start
            transcriptEl.classList.remove('text-slate-500', 'dark:text-slate-400');
        };

        recognition.onresult = (event) => {
            let interimTranscript = '';
            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript += event.results[i][0].transcript + ' '; // Added space
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            transcriptEl.textContent = finalTranscript + interimTranscript;
        };

        recognition.onerror = (event) => {
            console.error('Speech recognition error:', event.error);
            sttStatus.classList.remove('bg-red-500', 'listening-pulse');
            sttStatus.classList.add('bg-slate-400');
            statusText.textContent = `Error: ${event.error}`;
        };

        recognition.onend = () => {
            isListening = false;
            sttStatus.classList.remove('bg-red-500', 'listening-pulse');
            sttStatus.classList.add('bg-slate-400');
            statusText.textContent = 'Idle';
            startButton.disabled = false;
            stopButton.disabled = true;
            languageSelect.disabled = false; 
            if (transcriptEl.textContent.trim() === '') {
                transcriptEl.textContent = 'Press the microphone button to start transcribing...';
                transcriptEl.classList.add('text-slate-500', 'dark:text-slate-400');
            }
        };

        // --- Event Listeners for Buttons & Controls ---

        startButton.addEventListener('click', () => {
            if (!isListening) {
                finalTranscript = ''; 
                transcriptEl.textContent = '';
                try {
                    recognition.start();
                } catch(e) {
                    console.error("Error starting recognition: ", e);
                    alert("Recognition could not be started. It might already be running.");
                }
            }
        });

        stopButton.addEventListener('click', () => {
            if (isListening) {
                recognition.stop();
            }
        });
        
        languageSelect.addEventListener('change', () => {
            recognition.lang = languageSelect.value;
        });

        increaseFontBtn.addEventListener('click', () => {
            const currentSize = parseFloat(window.getComputedStyle(transcriptEl).fontSize);
            if (currentSize < 40) {
                transcriptEl.style.fontSize = `${currentSize + 2}px`;
            }
        });

        decreaseFontBtn.addEventListener('click', () => {
            const currentSize = parseFloat(window.getComputedStyle(transcriptEl).fontSize);
            if (currentSize > 10) {
                transcriptEl.style.fontSize = `${currentSize - 2}px`;
            }
        });

    </script>
</body>
</html>
